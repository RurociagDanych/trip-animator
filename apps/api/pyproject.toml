[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trip-api"
version = "0.1.0"
description = "Hardened FastAPI backend for Trip Animator"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14.0",
  "argon2-cffi>=23.1.0",
  "boto3>=1.36.0",
  "cryptography>=44.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pillow>=11.0.0",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.37",
  "trip-object-store",
  "trip-telemetry",
  "uvicorn[standard]>=0.34.0",
]

[tool.uv.sources]
trip-object-store = { workspace = true }
trip-telemetry = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/trip_api"]
