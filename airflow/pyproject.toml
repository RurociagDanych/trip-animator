[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trip-airflow"
version = "0.1.0"
description = "Optional Apache Airflow 3 orchestration layer for Trip Animator"
requires-python = ">=3.12,<3.13"
dependencies = [
  "apache-airflow>=3.0.0,<3.2",
  "apache-airflow-providers-postgres>=6.0.0",
  "dbt-duckdb>=1.9.0",
  "trip-api",
  "trip-object-store",
  "trip-telemetry",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
]

[tool.uv.sources]
trip-telemetry = { path = "../packages/telemetry", editable = true }
trip-object-store = { path = "../packages/object-store", editable = true }
trip-api = { path = "../apps/api", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/trip_airflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
