services:
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.12.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/trip.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/trip.yaml:ro
      - ./observability/service-probes.yaml:/etc/prometheus/service-probes.yaml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_token
    networks:
      - backend
      - observability

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.0.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_LOCAL_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/trip-dashboards:ro
    secrets:
      - grafana_admin_password
    networks:
      - observability
      - grafana_access

  service-probes:
    profiles: [observability]
    image: prom/blackbox-exporter:v0.29.1
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command:
      - --config.file=/etc/blackbox/trip.yaml
    volumes:
      - ./observability/blackbox.yaml:/etc/blackbox/trip.yaml:ro
    networks:
      - observability
      - backend
      - edge

secrets:
  metrics_token:
    environment: METRICS_TOKEN
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD

volumes:
  prometheus_data:
  grafana_data:

networks:
  observability:
    internal: true
  grafana_access: {}
