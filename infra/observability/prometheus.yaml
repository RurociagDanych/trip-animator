global:
  scrape_interval: 30s
  scrape_timeout: 5s

scrape_config_files:
  - /etc/prometheus/service-probes.yaml

scrape_configs:
  - job_name: trip-api
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: trip_api_up|trip_db_up|trip_render_jobs_total|trip_render_queue_oldest_age_seconds|trip_ingest_queue_(depth|oldest_age_seconds)|trip_api_http_request_duration_seconds_(bucket|count|sum)
        action: keep
