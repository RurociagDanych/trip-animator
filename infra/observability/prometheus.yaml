global:
  scrape_interval: 30s
  scrape_timeout: 5s

scrape_configs:
  - job_name: trip-api
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: trip_api_up|trip_db_up|trip_render_jobs_total
        action: keep
