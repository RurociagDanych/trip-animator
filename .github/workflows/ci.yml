name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          install -m 0755 "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/gitleaks-bin/gitleaks"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version | grep -Fx '8.30.1'
      - name: Scan publication history and source
        run: bash scripts/check-publication-secrets.sh
      - name: Exercise publication gate regressions
        run: python3 -m unittest discover -s scripts/tests -v

  python-lint-type:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Python workspace
        run: uv sync --all-packages --frozen
      - name: Ruff lint
        run: uv run ruff check apps packages airflow infra/scripts
      - name: Ruff format check
        run: uv run ruff format --check apps packages airflow infra/scripts
      - name: Mypy typecheck
        run: uv run mypy apps/api/src apps/worker/src packages/telemetry/src packages/object-store/src packages/marked-trails/src airflow/src

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_POSTGRES_URL: postgresql://trip:trip@127.0.0.1:5432/trip_test
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: trip_test
          POSTGRES_USER: trip
          POSTGRES_PASSWORD: trip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trip -d trip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Python workspace
        run: uv sync --all-packages --frozen
      - name: Install Chromium headless shell
        run: uv run --frozen playwright install --with-deps --only-shell chromium
      - name: Pytest suite (non-Postgres)
        run: >-
          uv run pytest --strict-markers -ra -m "not postgres and not docker"
          packages/telemetry/tests packages/object-store/tests packages/marked-trails/tests
          apps/api/tests apps/worker/tests
      - name: Pytest suite (Postgres integration, non-skipped)
        shell: bash
        run: |
          set -euo pipefail
          junit_xml="${RUNNER_TEMP}/pytest-postgres.xml"
          uv run pytest -m postgres --strict-markers -ra --junitxml="$junit_xml" apps/api/tests apps/worker/tests
          python3 -c '
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          total = sum(int(s.attrib.get("tests", 0)) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
          print(f"Postgres tests: total={total} skipped={skipped} failures={failures} errors={errors}")
          assert total >= 1, "No postgres tests executed"
          assert skipped == 0, f"Postgres tests were skipped ({skipped})"
          assert failures == 0 and errors == 0
          ' "$junit_xml"

  dbt-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Python workspace
        run: uv sync --all-packages --frozen
      - name: Generate deterministic Silver Parquet fixture
        shell: bash
        run: |
          set -euo pipefail
          dbt_ci_dir="${RUNNER_TEMP}/dbt_ci"
          mkdir -p "${dbt_ci_dir}/silver" "${dbt_ci_dir}/gold"
          uv run python -c '
          import sys
          from datetime import UTC, datetime, timedelta
          from pathlib import Path
          from trip_telemetry import ParsedTrack, TrackPoint, build_silver_dataframe, write_silver_parquet
          from trip_telemetry.ref_data import resolve_ref_data_dir

          base_dir = Path(sys.argv[1])
          silver_dir = base_dir / "silver"
          resolve_ref_data_dir(base_dir / "ref", ensure_exists=True)

          def make_track(base_dt: datetime, lat0: float, lon0: float, *, include_dwell: bool) -> ParsedTrack:
              pts: list[TrackPoint] = []
              for i in range(20):
                  pts.append(
                      TrackPoint(
                          lat=lat0 + i * 0.0012,
                          lon=lon0 + i * 0.0004,
                          elev_m=1000.0 + i * 10.0,
                          ts_utc=base_dt + timedelta(seconds=i * 60),
                          hr_bpm=140 + (i % 15),
                          cadence=85,
                          watts=210 + (i % 30),
                          segment_idx=0 if i < 12 else 1,
                      )
                  )
              if include_dwell:
                  pts[-1].moving = False
                  for j in range(1, 4):
                      pts.append(
                          TrackPoint(
                              lat=pts[-1].lat,
                              lon=pts[-1].lon,
                              elev_m=pts[-1].elev_m,
                              ts_utc=base_dt + timedelta(seconds=19 * 60 + j * 60),
                              moving=False,
                              segment_idx=1,
                          )
                      )
              return ParsedTrack(
                  name="CI Fixture Stage",
                  points=pts,
                  point_count=len(pts),
                  segment_count=2,
                  has_timestamps=True,
                  has_elevation=True,
              )

          df1, _ = build_silver_dataframe(
              make_track(datetime(2024, 7, 1, 8, 0, 0, tzinfo=UTC), 0.120, 0.340, include_dwell=True),
              trip_id="trip-ci",
              stage_id="stage-ci-1",
          )
          df2, _ = build_silver_dataframe(
              make_track(datetime(2024, 7, 2, 8, 0, 0, tzinfo=UTC), 0.220, 0.440, include_dwell=False),
              trip_id="trip-ci",
              stage_id="stage-ci-2",
          )
          write_silver_parquet(df1, silver_dir / "stage-ci-1.parquet")
          write_silver_parquet(df2, silver_dir / "stage-ci-2.parquet")
          ' "${dbt_ci_dir}"
      - name: dbt parse
        run: uv run dbt parse --project-dir dbt --profiles-dir dbt
      - name: dbt build
        shell: bash
        run: |
          set -euo pipefail
          dbt_ci_dir="${RUNNER_TEMP}/dbt_ci"
          export DBT_DUCKDB_PATH="${dbt_ci_dir}/gold/trip_analytics.duckdb"
          uv run dbt build \
            --project-dir dbt \
            --profiles-dir dbt \
            --target-path "${dbt_ci_dir}/target" \
            --log-path "${dbt_ci_dir}/logs" \
            --vars "{\"silver_parquet_glob\": \"${dbt_ci_dir}/silver/*.parquet\", \"ref_data_dir\": \"${dbt_ci_dir}/ref\"}"

  airflow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Airflow project
        run: uv sync --project airflow --frozen
      - name: Airflow DAG integrity & task suite
        run: make test-airflow

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck:web
      - name: Lint
        run: pnpm lint:web
      - name: Test
        run: pnpm test:web
      - name: Build
        run: pnpm build:web

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose config
        run: |
          docker compose -f infra/compose.yaml --env-file .env.example config --quiet
      - name: Build required Airflow runtime
        run: docker build -f infra/docker/Dockerfile.airflow -t trip-airflow-ci .

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false
      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/terraform
      - name: Terraform Validate (dev)
        working-directory: infra/terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate
      - name: Terraform Validate (prod)
        working-directory: infra/terraform/environments/prod
        run: |
          terraform init -backend=false
          terraform validate
