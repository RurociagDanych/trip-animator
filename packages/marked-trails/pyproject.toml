[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trip-marked-trails"
version = "0.1.0"
description = "Build-and-publish CLI for the Marked Trails PMTiles overlay from OpenStreetMap extracts"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.28.0",
  "trip-object-store",
]

[project.scripts]
trip-marked-trails = "trip_marked_trails.cli:run"

[tool.uv.sources]
trip-object-store = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/trip_marked_trails"]
