[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trip-object-store"
version = "0.1.0"
description = "Shared ObjectStore interface with traversal-safe Local filesystem and S3-compatible backends"
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.36.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trip_object_store"]
